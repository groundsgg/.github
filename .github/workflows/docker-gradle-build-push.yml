name: Docker Gradle Build and Push

on:
  workflow_call:
    inputs:
      runner:
        description: >
          Runner label. Leave unset and the job picks one by repository
          visibility: GitHub's free amd64 runner in public repos, a 2 vCPU
          amd64 Blacksmith runner in private ones. amd64 either way — the
          clusters are amd64 and building amd64 on arm64 would mean QEMU.
        required: false
        type: string
        default: ""
    secrets:
      PACKAGES_TOKEN:
        description: >
          Optional token used to resolve GitHub Packages dependencies. Needed
          only when a build depends on a Maven package owned by a *different*
          private repository: Maven packages are repository-scoped, so they
          inherit that repository's permissions, and the per-job GITHUB_TOKEN
          is scoped to the calling repository alone. Falls back to
          GITHUB_TOKEN when unset, which is right for every repo whose
          dependencies are public or its own.
        required: false

concurrency:
  group: docker-build-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-build-push:
    # amd64 on purpose. The clusters this image runs on are amd64 (both UKS
    # node pools report it), and an arm64-only image gets pulled happily and
    # then dies at exec with "exec format error" — which is exactly what
    # happened to grounds-forge 4.3.0 in its migrate init container. Building
    # an amd64 image on an arm64 runner would mean QEMU for the whole build.
    # Public repos run on GitHub's free amd64 runner; private ones stay on
    # Blacksmith, where the layer cache lives on a real disk and where
    # GitHub-hosted minutes would come out of the org's 2,000/month allowance
    # at four times the Blacksmith rate. Tests `visibility` rather than
    # `repository.private`, which GitHub would coerce to a number — an absent
    # field then compares equal to false.
    runs-on: >-
      ${{ inputs.runner != '' && inputs.runner
          || (github.event.repository.visibility == 'public'
              && 'ubuntu-24.04'
              || 'blacksmith-2vcpu-ubuntu-2404') }}
    timeout-minutes: 30
    env:
      TAG_TYPE: ${{ github.ref_type == 'tag' && 'release' || 'edge' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
          # Without this the `./gradlew -q properties` step below resolves the
          # whole dependency graph from scratch on every run — measured at ~98s
          # median in service-moderation, a third of the job, to read one
          # version string.
          cache: "gradle"

      - name: Configure GitHub Packages credentials
        run: |
          mkdir -p ~/.gradle
          {
            echo "github.user=${{ github.actor }}"
            echo "github.token=${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}"
          } > ~/.gradle/gradle.properties

      - name: Read Gradle project version
        id: gradle_version
        run: |
          set -euo pipefail
          props="$(./gradlew -q properties)"
          version="$(printf '%s\n' "$props" | awk -F': ' '/^version: /{print $2; exit}')"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # Must come before either builder is set up. This relocates DOCKER_CONFIG,
      # and buildx records its builder inside whichever DOCKER_CONFIG is active
      # when it runs — moving the variable afterwards loses the builder, so
      # buildx silently falls back to the built-in `docker` driver and then
      # fails with "Cache export is not supported for the docker driver".
      - name: Prepare Docker auth config
        run: |
          docker_config="${{ runner.temp }}/docker-config"
          mkdir -p "$docker_config"
          echo "DOCKER_CONFIG=${docker_config}" >> "$GITHUB_ENV"

      # Two mutually exclusive builders. The Blacksmith actions only run on
      # Blacksmith runners, so a public repo on a GitHub-hosted runner needs
      # the upstream buildx pair instead.
      - name: Set up Buildx (public repos)
        if: github.event.repository.visibility == 'public'
        uses: docker/setup-buildx-action@v4

      - name: Setup Blacksmith Builder (private repos)
        if: github.event.repository.visibility != 'public'
        uses: useblacksmith/setup-docker-builder@v1
        with:
          # Blacksmith skips pruning entirely unless this is set, so these
          # disks had grown unbounded since the migration. The live
          # service-permissions disk measures 2.43 GB, so 3 GB keeps a full
          # build's cache and prunes only churn. Billed at $0.50/GB/mo.
          max-cache-size-mb: 3072

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=match,pattern=v(.*),group=1,enable=${{ env.TAG_TYPE == 'release' }}
            type=raw,value=edge,enable=${{ env.TAG_TYPE != 'release' }}
            type=sha,prefix=sha-,enable=${{ env.TAG_TYPE != 'release' }}
          labels: |
            org.opencontainers.image.authors=Grounds Development Team
            org.opencontainers.image.created={{date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'}}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://docs.grounds.gg
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.gradle_version.outputs.value }}
            org.opencontainers.image.vendor=Grounds
            org.opencontainers.image.ref.name=${{ github.sha }}

      # Public repos build with the upstream action and the GitHub Actions
      # cache. Note what that does *not* cover: BuildKit `RUN --mount=type=cache`
      # mounts are never exported by the gha cache backend, only by a real
      # disk — so the Gradle dependency cache these Dockerfiles mount starts
      # empty on every public run. Layers still cache; dependency resolution
      # does not. That is the cost of getting off a paid runner here.
      - name: Build image (public repos)
        if: github.event.repository.visibility == 'public'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GITHUB_USER=${{ github.actor }}
          secrets: |
            github_token=${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build image (private repos)
        if: github.event.repository.visibility != 'public'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GITHUB_USER=${{ github.actor }}
          secrets: |
            github_token=${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Push image (public repos)
        if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          build-args: |
            GITHUB_USER=${{ github.actor }}
          secrets: |
            github_token=${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Push image (private repos)
        if: github.event_name != 'pull_request' && github.event.repository.visibility != 'public'
        uses: useblacksmith/build-push-action@v2
        with:
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GITHUB_USER=${{ github.actor }}
          secrets: |
            github_token=${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: spdx-json
          output-file: sbom.spdx.json
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SBOM
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ env.TAG_TYPE }}
          path: sbom.spdx.json
          retention-days: 30
