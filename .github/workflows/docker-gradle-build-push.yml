name: Docker Gradle Build and Push

on:
  workflow_call:
    inputs:
      runner:
        description: >
          Runner label. Leave unset and the job picks one by repository
          visibility: GitHub's amd64 runner in public repos, the repository's
          own ARC runner in private ones. amd64 either way — the
          clusters are amd64 and building amd64 on arm64 would mean QEMU.
        required: false
        type: string
        default: ""
    secrets:
      PACKAGES_TOKEN:
        description: >
          Optional token used to resolve GitHub Packages dependencies. Needed
          only when a build depends on a Maven package owned by a *different*
          private repository: Maven packages are repository-scoped, so they
          inherit that repository's permissions, and the per-job GITHUB_TOKEN
          is scoped to the calling repository alone. Falls back to
          GITHUB_TOKEN when unset, which is right for every repo whose
          dependencies are public or its own.
        required: false

concurrency:
  group: docker-build-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-build-push:
    # amd64 on purpose. The clusters this image runs on are amd64 (both UKS
    # node pools report it), and an arm64-only image gets pulled happily and
    # then dies at exec with "exec format error" — which is exactly what
    # happened to grounds-forge 4.3.0 in its migrate init container. Building
    # an amd64 image on an arm64 runner would mean QEMU for the whole build.
    # Public fork PRs remain on GitHub-hosted runners; private repositories
    # use their own ARC scale set. Missing repository payloads safely fall
    # back to GitHub-hosted rather than the unavailable Blacksmith pool.
    runs-on: >-
      ${{ inputs.runner != '' && inputs.runner
          || (github.event.repository.visibility == 'public'
              && 'ubuntu-24.04')
          || github.event.repository.name
          || 'ubuntu-24.04' }}
    # Cold ARC builds can exceed 30m downloading builder/runtime base images
    # even after Gradle succeeds. Keep the default repo-ARC path bounded at
    # 60m; public/hosted fallbacks and explicit runner overrides retain 30m.
    timeout-minutes: >-
      ${{ inputs.runner == ''
          && github.event.repository.visibility != 'public'
          && github.event.repository.name
          && 60 || 30 }}
    env:
      TAG_TYPE: ${{ github.ref_type == 'tag' && 'release' || 'edge' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
          # Without this the `./gradlew -q properties` step below resolves the
          # whole dependency graph from scratch on every run — measured at ~98s
          # median in service-moderation, a third of the job, to read one
          # version string.
          cache: "gradle"

      - name: Configure GitHub Packages credentials
        run: |
          mkdir -p ~/.gradle
          {
            echo "github.user=${{ github.actor }}"
            echo "github.token=${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}"
          } > ~/.gradle/gradle.properties

      - name: Read Gradle project version
        id: gradle_version
        run: |
          set -euo pipefail
          props="$(./gradlew -q properties)"
          version="$(printf '%s\n' "$props" | awk -F': ' '/^version: /{print $2; exit}')"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # Must come before either builder is set up. This relocates DOCKER_CONFIG,
      # and buildx records its builder inside whichever DOCKER_CONFIG is active
      # when it runs — moving the variable afterwards loses the builder, so
      # buildx silently falls back to the built-in `docker` driver and then
      # fails with "Cache export is not supported for the docker driver".
      - name: Prepare Docker auth config
        run: |
          docker_config="${{ runner.temp }}/docker-config"
          mkdir -p "$docker_config"
          echo "DOCKER_CONFIG=${docker_config}" >> "$GITHUB_ENV"

      # Where BuildKit keeps its layer cache, decided on the runner:
      #   - GitHub-hosted: the repository-scoped GHA cache.
      #   - self-hosted with BUILDKIT_CACHE_REGISTRY: that registry. The hbr1 ARC
      #     runners advertise one next to them (plain HTTP, cluster-internal),
      #     the same way they advertise GRADLE_BUILD_CACHE_URL. The GHA cache is
      #     no option there: pulled from hbr1 it crawled, 2026-09-29 one 93 MB
      #     layer took 20+ minutes.
      #   - anything else: no layer cache.
      # Exports to the registry use ignore-error so a cache hiccup costs a cold
      # build next time rather than failing this one.
      - name: Resolve layer cache
        id: layer_cache
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY#*/}"
          from=""; to=""; config=""
          if [ "${RUNNER_ENVIRONMENT:-}" = "github-hosted" ]; then
            from="type=gha,scope=${GITHUB_REPOSITORY}-amd64"
            to="type=gha,scope=${GITHUB_REPOSITORY}-amd64,mode=max"
          elif [ -n "${BUILDKIT_CACHE_REGISTRY:-}" ]; then
            ref="${BUILDKIT_CACHE_REGISTRY}/cache/${repo}:amd64"
            from="type=registry,ref=${ref}"
            to="type=registry,ref=${ref},mode=max,ignore-error=true"
            config="[registry.\"${BUILDKIT_CACHE_REGISTRY}\"]
            http = true
            insecure = true"
          fi
          {
            echo "from=${from}"
            echo "to=${to}"
            echo "buildkitd-config<<EOF_BUILDKITD"
            echo "${config}"
            echo "EOF_BUILDKITD"
          } >> "$GITHUB_OUTPUT"
          echo "layer cache: ${from:-none}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          buildkitd-config-inline: ${{ steps.layer_cache.outputs.buildkitd-config }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=match,pattern=v(.*),group=1,enable=${{ env.TAG_TYPE == 'release' }}
            type=raw,value=edge,enable=${{ env.TAG_TYPE != 'release' }}
            type=sha,prefix=sha-,enable=${{ env.TAG_TYPE != 'release' }}
          labels: |
            org.opencontainers.image.authors=Grounds Development Team
            org.opencontainers.image.created={{date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'}}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://docs.grounds.gg
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.gradle_version.outputs.value }}
            org.opencontainers.image.vendor=Grounds
            org.opencontainers.image.ref.name=${{ github.sha }}

      # Layer cache: see "Resolve layer cache". PRs read it but never write
      # cache or image tags. Cache mounts (e.g. Gradle dependency mounts) are
      # not exported either way.
      - name: Build image (pull requests)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ steps.layer_cache.outputs.from }}
          build-args: |
            GITHUB_USER=${{ github.actor }}
          secrets: |
            github_token=${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ steps.layer_cache.outputs.from }}
          cache-to: ${{ steps.layer_cache.outputs.to }}
          build-args: |
            GITHUB_USER=${{ github.actor }}
          secrets: |
            github_token=${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: spdx-json
          output-file: sbom.spdx.json
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SBOM
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ env.TAG_TYPE }}
          path: sbom.spdx.json
          retention-days: 30
