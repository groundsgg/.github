name: Docker workflow contract

on:
  pull_request:
    paths:
      - '.github/workflows/docker-gradle-build-push.yml'
      - '.github/workflows/docker-workflow-contract.yml'
      - 'tests/test_docker_workflow.py'
      - 'tests/docker-smoke/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/docker-gradle-build-push.yml'
      - '.github/workflows/docker-workflow-contract.yml'
      - 'tests/test_docker_workflow.py'
      - 'tests/docker-smoke/**'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.3
      - run: python -m unittest discover -s tests -v
  buildx-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - uses: docker/build-push-action@v7
        with:
          context: tests/docker-smoke
          load: true
          platforms: linux/amd64
          tags: grounds-buildx-smoke:test
          cache-to: type=gha,scope=docker-workflow-smoke-${{ github.run_id }},mode=max
      - uses: docker/setup-buildx-action@v4
        with:
          name: smoke-reimport
          driver: docker-container
      - uses: docker/build-push-action@v7
        with:
          context: tests/docker-smoke
          load: true
          platforms: linux/amd64
          tags: grounds-buildx-smoke:test
          cache-from: type=gha,scope=docker-workflow-smoke-${{ github.run_id }}
      - run: test "$(docker image inspect grounds-buildx-smoke:test --format '{{.Architecture}}')" = amd64
