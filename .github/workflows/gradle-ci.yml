name: Gradle CI

on:
  workflow_call:
    inputs:
      runner:
        description: >
          Runner label. Leave unset and the job picks one by repository
          visibility: GitHub's arm64 hosted runner in public repos, where it
          is free and has 4 vCPUs, and a RunsOn spot instance (amd64, 4 vCPU,
          16 GB) in private repos, where GitHub-hosted arm64 is not offered.
          Set it explicitly to override, e.g. a RunsOn label with
          `cpu=8/ram=32` for a build that needs more memory.
        required: false
        type: string
        default: ""
    secrets:
      PACKAGES_TOKEN:
        description: >
          Optional token used to resolve GitHub Packages dependencies. Needed
          only when a build depends on a Maven package owned by a *different*
          private repository: Maven packages are repository-scoped, so they
          inherit that repository's permissions, and the per-job GITHUB_TOKEN
          is scoped to the calling repository alone. Falls back to
          GITHUB_TOKEN when unset, which is right for every repo whose
          dependencies are public or its own.
        required: false

concurrency:
  group: gradle-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
      # Read the three branches in order. A public repo keeps a GitHub-hosted
      # runner: on a self-hosted runner a fork PR would run arbitrary code on
      # our own infrastructure. A private repo goes to RunsOn, an ephemeral
      # spot instance (m8a, m7a or m8i) in our AWS account (eu-central-1), sized per job in
      # the label. And if `repository` is missing from the event payload, the
      # job lands on hosted amd64 `ubuntu-24.04`, which exists for public and
      # private repos alike -- hosted arm64 does not exist for private ones, and
      # a label no runner matches queues until someone cancels the job.
    runs-on: >-
      ${{ inputs.runner != '' && inputs.runner
          || (github.event.repository.visibility == 'public'
              && 'ubuntu-24.04-arm')
          || (github.event.repository.name
              && format('runs-on={0}/cpu=4/ram=16/family=m8a+m7a+m8i/spot=capacity-optimized/image=ubuntu24-full-x64/extras=s3-cache', github.run_id))
          || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      # RunsOn (AWS) runners: routes the Actions cache to RunsOn's S3-backed
      # Magic Cache. Needs `extras=s3-cache` in the runner label.
      - name: Enable RunsOn Magic Cache
        if: startsWith(runner.name, 'runs-on--')
        uses: runs-on/action@v2

      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
          # The GitHub Actions cache is a Azure-hosted download: from the self-hosted
          # runners on hbr1 it stalled at 0 bytes for minutes and crawled at ~1 MB/s
          # (2026-09-30), slower than resolving the dependencies from scratch. Hosted
          # runners keep it; other self-hosted ones use the Gradle build cache node.
          # RunsOn runners use the Actions cache through the Magic Cache.
          cache: ${{ (runner.environment == 'github-hosted' || startsWith(runner.name, 'runs-on--')) && 'gradle' || '' }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: ${{ runner.environment != 'github-hosted' && !startsWith(runner.name, 'runs-on--') }}

      - name: Use the Maven mirror
        uses: groundsgg/.github/.github/actions/maven-mirror@main

      - name: Configure GitHub Packages credentials
        run: |
          mkdir -p ~/.gradle
          {
            echo "github.user=${{ github.actor }}"
            echo "github.token=${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}"
          } > ~/.gradle/gradle.properties

      - name: Build
        run: |
          ./gradlew build --exclude-task test

      # Quarkus Dev Services request container reuse, and Testcontainers ignores
      # the request unless the runner opts in, so every test profile restart
      # started fresh containers. The runner is thrown away after the job, so
      # nothing reused can outlive it.
      - name: Allow Testcontainers reuse
        run: echo "testcontainers.reuse.enable=true" >> ~/.testcontainers.properties

      - name: Test
        run: |
          ./gradlew test
