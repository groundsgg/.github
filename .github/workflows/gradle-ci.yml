name: Gradle CI

on:
  workflow_call:
    inputs:
      runner:
        description: >
          Runner label. Leave unset and the job picks one by repository
          visibility: GitHub's arm64 hosted runner in public repos, where it
          is free and has 4 vCPUs, and a 2 vCPU arm64 Blacksmith runner in
          private repos, where GitHub-hosted arm64 is not offered. Set it
          explicitly to override — an amd64 label if a test image has no
          arm64 variant, or a larger Blacksmith label for a build that is
          measurably CPU-bound and on someone's critical path.
        required: false
        type: string
        default: ""
    secrets:
      PACKAGES_TOKEN:
        description: >
          Optional token used to resolve GitHub Packages dependencies. Needed
          only when a build depends on a Maven package owned by a *different*
          private repository: Maven packages are repository-scoped, so they
          inherit that repository's permissions, and the per-job GITHUB_TOKEN
          is scoped to the calling repository alone. Falls back to
          GITHUB_TOKEN when unset, which is right for every repo whose
          dependencies are public or its own.
        required: false

concurrency:
  group: gradle-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Falls back to Blacksmith whenever `visibility` is absent from the event
    # payload, because GitHub-hosted arm64 does not exist for private repos and
    # guessing wrong there means "no runner matches" rather than a bigger bill.
    runs-on: >-
      ${{ inputs.runner != '' && inputs.runner
          || (github.event.repository.visibility == 'public'
              && 'ubuntu-24.04-arm'
              || 'blacksmith-2vcpu-ubuntu-2404-arm') }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure GitHub Packages credentials
        run: |
          mkdir -p ~/.gradle
          {
            echo "github.user=${{ github.actor }}"
            echo "github.token=${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}"
          } > ~/.gradle/gradle.properties

      - name: Build
        run: |
          ./gradlew build --exclude-task test

      - name: Test
        run: |
          ./gradlew test
