name: Gradle Publish Release

on:
  workflow_call:
    inputs:
      runner:
        description: >
          Runner label. Leave unset and the job picks one by repository
          visibility: GitHub's arm64 hosted runner in public repos, where it
          is free and has 4 vCPUs, and the shared self-hosted `grounds-runners`
          pool (amd64) in private repos, where GitHub-hosted arm64 is not
          offered. Set it explicitly to override, e.g. `grounds-runners-large`
          for a build that needs more memory than the shared pool gives.
        required: false
        type: string
        default: ""
    secrets:
      PACKAGES_TOKEN:
        description: >
          Optional read-only token for resolving GitHub Packages dependencies.
          Needed only when a build depends on a Maven package owned by a
          different private repository: Maven packages are repository-scoped,
          so they inherit that repository's permissions, and the per-job
          GITHUB_TOKEN is scoped to the calling repository alone. Falls back to
          GITHUB_TOKEN when unset, which is correct for every repo whose
          dependencies are public or its own.
        required: false

concurrency:
  group: gradle-publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
      # Read the three branches in order. A public repo keeps a GitHub-hosted
      # runner: on a self-hosted pool a fork PR would run arbitrary code on
      # hbr1, which also hosts production containers (the org's Default runner
      # group refuses public repositories as a second line). A private repo goes
      # to `grounds-runners`, the shared self-hosted ARC pool (org-level, on
      # hbr1 today). And if `repository` is missing from the event payload, the
      # job lands on hosted amd64 `ubuntu-24.04`, which exists for public and
      # private repos alike -- hosted arm64 does not exist for private ones, and
      # a label no runner matches queues until someone cancels the job.
    runs-on: >-
      ${{ inputs.runner != '' && inputs.runner
          || (github.event.repository.visibility == 'public'
              && 'ubuntu-24.04-arm')
          || (github.event.repository.name && 'grounds-runners')
          || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
          # The GitHub Actions cache is a Azure-hosted download: from the self-hosted
          # runners on hbr1 it stalled at 0 bytes for minutes and crawled at ~1 MB/s
          # (2026-09-30), slower than resolving the dependencies from scratch. Hosted
          # runners keep it; self-hosted ones use the Gradle build cache node.
          cache: ${{ runner.environment == 'github-hosted' && 'gradle' || '' }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: ${{ runner.environment != 'github-hosted' }}

      - name: Configure GitHub Packages credentials for resolution
        run: |
          mkdir -p ~/.gradle
          {
            echo "github.user=${{ github.actor }}"
            echo "github.token=${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}"
          } > ~/.gradle/gradle.properties

      - name: Build
        run: ./gradlew build -Pversion=${{ github.ref_name }}

      # Rewritten deliberately, and this cannot be folded into the step above.
      # Publishing targets *this* repository's registry, which the per-job
      # GITHUB_TOKEN already covers, while PACKAGES_TOKEN only needs to read
      # someone else's. The convention plugin resolves its publish credentials
      # from the `github.token` Gradle property *before* falling back to the
      # GITHUB_TOKEN environment variable, so leaving a read-only token in the
      # properties file would make the publish step authenticate with it and
      # fail on write.
      - name: Configure GitHub Packages credentials for publishing
        run: |
          {
            echo "github.user=${{ github.actor }}"
            echo "github.token=${{ secrets.GITHUB_TOKEN }}"
          } > ~/.gradle/gradle.properties

      - name: Publish package
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag_name="${GITHUB_REF#refs/tags/}"
          # Remove the leading 'v' from the tag to get the version number
          version_override="${tag_name#v}"

          ./gradlew publish -PversionOverride="$version_override"
