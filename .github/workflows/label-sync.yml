name: Sync Labels

on:
  workflow_call:

concurrency:
  group: label-sync-${{ github.repository }}
  cancel-in-progress: true

jobs:
  sync-labels:
    # Free GitHub-hosted runner in public repos; Blacksmith in private ones,
    # where GitHub-hosted arm64 is not offered. Tests `visibility` rather than
    # `repository.private` because GitHub coerces `==` operands to numbers, so
    # an absent `private` field would compare equal to false and hand a private
    # repo a label that does not exist there.
      # Self-hosted ARC runners on hbr1. The label is the calling repository's
      # own name, which is how each repo reaches its own scale set without
      # passing anything.
      #
      # Read the three branches in order. A public repo keeps a GitHub-hosted
      # runner: on a self-hosted pool a fork PR would run arbitrary code on
      # hbr1, which also hosts production containers. A private repo goes to
      # its own runner. And if `repository` is missing from the event payload
      # -- which is why this used to fall back to Blacksmith -- the name is
      # empty and Blacksmith still catches it, because an empty label matches
      # no runner at all and the job would queue until someone cancels it.
    runs-on: >-
      ${{ (github.event.repository.visibility == 'public'
            && 'ubuntu-24.04-arm')
          || github.event.repository.name
          || 'blacksmith-2vcpu-ubuntu-2404-arm' }}
    timeout-minutes: 10
    steps:
      - name: Download labels.yml
        run: |
          curl -fsSL "https://raw.githubusercontent.com/groundsgg/.github/refs/heads/main/.github/labels.yml" -o labels.yml

      - name: Sync labels
        uses: crazy-max/ghaction-github-labeler@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: labels.yml
          dry-run: ${{ github.event_name == 'pull_request' }}
          skip-delete: false
          exclude: |
            help*
            *issue
            autorelease*
