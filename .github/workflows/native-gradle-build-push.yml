name: Native Gradle Build and Push

on:
  workflow_call:
    inputs:
      runner:
        description: Optional runner label; defaults to the standard 16 GiB native-build runner.
        type: string
        default: ''
      targets:
        description: Space-separated Dockerfile.native targets (native-micro and optionally native-distroless).
        type: string
        default: native-micro
      verify-command:
        description: Optional repository-owned command for packaged-image contracts, after building and before publishing.
        type: string
        default: ''
      alias-prefix:
        description: Optional standard-tag prefix for repositories that also release a separate JVM worker image (for example native-).
        type: string
        default: ''
    secrets:
      PACKAGES_TOKEN:
        description: Optional access to private cross-repository Maven packages.
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: native-build-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.visibility == 'public' && 'ubuntu-24.04') || (github.event.repository.name && format('runs-on={0}/cpu=4/ram=16/family=m8a+m7a+m8i/spot=capacity-optimized/image=ubuntu24-full-x64/extras=s3-cache/sticky=docker:30gb:lazy-init', github.run_id)) || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      NATIVE_TARGETS: ${{ inputs.targets }}
      VERIFY_COMMAND: ${{ inputs.verify-command }}
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      # Serves Gradle's HTTP build cache from RunsOn's S3 bucket for the test
      # step below. The native image itself is built by BuildKit, on the sticky
      # disk. Needs `extras=s3-cache` and RunsOn v3.6.0; an older stack warns.
      # Only the default branch saves the sticky disk; other refs restore the
      # default branch's snapshot without writing their own (see
      # docker-gradle-build-push.yml).
      - name: Enable RunsOn Magic Cache
        if: startsWith(runner.name, 'runs-on--')
        uses: runs-on/action@v2
        with:
          remote_cache: gradle
          sticky_save: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: ${{ runner.environment == 'self-hosted' }}
      - uses: docker/setup-buildx-action@v4
      - name: Unit tests and immutable build identity
        run: |
          test ! -e "$GRADLE_USER_HOME/gradle.properties"
          umask 077
          mkdir -p "$GRADLE_USER_HOME"
          trap 'rm -f "$GRADLE_USER_HOME/gradle.properties"' EXIT
          printf 'github.user=%s\ngithub.token=%s\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n' "$GITHUB_ACTOR" "$PACKAGES_TOKEN" > "$GRADLE_USER_HOME/gradle.properties"
          ./gradlew --no-daemon --build-cache -Pkotlin.compiler.execution.strategy=in-process test
          printf 'NATIVE_IMAGE_PREFIX=grounds/%s\n' "${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
          python3 - <<'PY' >> "$GITHUB_ENV"
          import hashlib, os, pathlib, subprocess
          digest = hashlib.sha256()
          paths = subprocess.check_output(['git', 'ls-files', '-cz', '--others', '--exclude-standard']).split(b'\0')
          for raw in sorted(set(paths)):
              if raw:
                  path = pathlib.Path(os.fsdecode(raw))
                  if path.is_file():
                      digest.update(raw + b'\0' + path.read_bytes())
          print('BUILD_SOURCE_SHA256=' + digest.hexdigest())
          PY
      - name: Build native runtime targets
        run: |
          python3 - <<'PYBAKE' > "$RUNNER_TEMP/native-bake.json"
          import json, os
          targets = os.environ['NATIVE_TARGETS'].split()
          if not targets or any(t not in ('native-micro', 'native-distroless') for t in targets):
              raise SystemExit('Select native-micro and/or native-distroless')
          args = {key: os.environ[value] for key, value in (
              ('GITHUB_USER', 'GITHUB_ACTOR'), ('BUILD_COMMIT', 'GITHUB_SHA'), ('BUILD_SOURCE_SHA256', 'BUILD_SOURCE_SHA256'))}
          print(json.dumps({'group': {'default': {'targets': targets}}, 'target': {
              target: {'context': '.', 'dockerfile': 'Dockerfile.native', 'target': target, 'platforms': ['linux/amd64'],
                       'args': args, 'secret': ['id=github_token,env=PACKAGES_TOKEN'],
                       'tags': [os.environ['NATIVE_IMAGE_PREFIX'] + ':' + target + '-pilot']}
              for target in targets}}))
          PYBAKE
          docker buildx bake --file "$RUNNER_TEMP/native-bake.json" --load
      - name: Verify native binaries and image identity
        run: |
          python3 - <<'PYVERIFY'
          import hashlib, json, os, pathlib, subprocess, tempfile
          expected = None
          for target in os.environ['NATIVE_TARGETS'].split():
              tag = os.environ['NATIVE_IMAGE_PREFIX'] + ':' + target + '-pilot'
              info = json.loads(subprocess.check_output(['docker', 'image', 'inspect', tag]))[0]
              assert (info['Os'], info['Architecture']) == ('linux', 'amd64'), tag
              assert info['Config']['User'].split(':')[0] not in ('', '0', 'root'), tag
              labels = info['Config']['Labels']
              assert labels['org.opencontainers.image.revision'] == os.environ['GITHUB_SHA'], tag
              assert labels['gg.grounds.source-tree-sha256'] == os.environ['BUILD_SOURCE_SHA256'], tag
              container = subprocess.check_output(['docker', 'create', tag], text=True).strip()
              try:
                  with tempfile.TemporaryDirectory() as tmp:
                      root = pathlib.Path(tmp)
                      for name in ('application', 'application.sha256'):
                          subprocess.run(['docker', 'cp', container + ':/deployments/' + name, str(root / name)], check=True)
                      with (root / 'application').open('rb') as binary:
                          digest = hashlib.file_digest(binary, 'sha256').hexdigest()
                      assert digest == (root / 'application.sha256').read_text().split()[0], tag
                      assert expected is None or digest == expected, 'Runtime targets must use the same native binary'
                      expected = digest
                      print(target + ' binary sha256=' + digest)
              finally:
                  subprocess.run(['docker', 'rm', container], check=True, stdout=subprocess.DEVNULL)
          PYVERIFY
      - name: Packaged-image contracts
        if: inputs.verify-command != ''
        run: |
          test ! -e "$GRADLE_USER_HOME/gradle.properties"
          umask 077
          mkdir -p "$GRADLE_USER_HOME"
          trap 'rm -f "$GRADLE_USER_HOME/gradle.properties"' EXIT
          printf 'github.user=%s\ngithub.token=%s\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n' "$GITHUB_ACTOR" "$PACKAGES_TOKEN" > "$GRADLE_USER_HOME/gradle.properties"
          bash -euo pipefail -c "$VERIFY_COMMAND"
      - name: Publish verified native images
        if: github.event_name != 'pull_request'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NATIVE_ALIAS_PREFIX: ${{ inputs.alias-prefix }}
        run: |
          prefix="${NATIVE_ALIAS_PREFIX:-}"
          if [[ -n "$prefix" && ! "$prefix" =~ ^[a-z0-9][a-z0-9_.-]{0,31}$ ]]; then
            echo 'Invalid native alias prefix' >&2
            exit 1
          fi
          aliases=()
          case "$GITHUB_REF" in
            refs/heads/main)
              aliases=(edge "sha-${GITHUB_SHA:0:7}")
              ;;
            refs/tags/v*)
              version="${GITHUB_REF#refs/tags/v}"
              semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$'
              if [[ ! "$version" =~ $semver || ${#version} -gt 128 ]]; then
                echo 'Invalid native release version' >&2
                exit 1
              fi
              if [[ "$version" == *-* ]]; then
                prerelease="${version#*-}"
                IFS='.' read -r -a identifiers <<< "$prerelease"
                for identifier in "${identifiers[@]}"; do
                  if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" =~ ^0[0-9]+$ ]]; then
                    echo 'Invalid numeric prerelease identifier' >&2
                    exit 1
                  fi
                done
                aliases=("$version")
              else
                aliases=("$version" latest)
              fi
              ;;
          esac
          for index in "${!aliases[@]}"; do
            aliases[$index]="$prefix${aliases[$index]}"
            if ((${#aliases[$index]} > 128)); then
              echo 'Native release alias exceeds Docker tag length' >&2
              exit 1
            fi
          done
          if ((${#aliases[@]})); then
            case " $NATIVE_TARGETS " in
              *' native-micro '*) ;;
              *) echo 'Standard aliases require a verified native-micro image' >&2; exit 1 ;;
            esac
          fi
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for target in $NATIVE_TARGETS; do
            image="ghcr.io/$GITHUB_REPOSITORY:$target-sha-$GITHUB_SHA"
            docker tag "$NATIVE_IMAGE_PREFIX:$target-pilot" "$image"
            docker push "$image"
            if [ "$target" = native-micro ]; then
              alias="ghcr.io/$GITHUB_REPOSITORY:native-sha-$GITHUB_SHA"
              docker tag "$NATIVE_IMAGE_PREFIX:$target-pilot" "$alias"
              docker push "$alias"
              for tag in "${aliases[@]}"; do
                alias="ghcr.io/$GITHUB_REPOSITORY:$tag"
                docker tag "$NATIVE_IMAGE_PREFIX:$target-pilot" "$alias"
                docker push "$alias"
              done
            fi
          done
      - name: Summary
        if: always()
        run: |
          printf 'Native targets: `%s`\n\nCommit: `%s`\n\nNo deployment is performed by this workflow.\n' \
            "$NATIVE_TARGETS" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
