name: Publish OpenAPI Snapshot

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the workflow artifact containing openapi.json
        required: true
        type: string
      service_id:
        description: Lowercase kebab-case service identifier
        required: true
        type: string
      service_title:
        description: Public API title
        required: true
        type: string
      service_slug:
        description: Lowercase kebab-case Scalar slug
        required: true
        type: string
      source_ref:
        description: Source release or workflow ref
        required: true
        type: string
      source_sha:
        description: Exact source commit SHA
        required: true
        type: string
    secrets:
      app_private_key:
        description: Private key for the dedicated OpenAPI publisher GitHub App
        required: true

permissions:
  contents: read

concurrency:
  group: openapi-snapshot-${{ inputs.service_id }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository_owner == 'groundsgg'
    # Was arc-linux. The self-hosted ARC scale sets were decommissioned, so
    # nothing serves that label any more and jobs would queue until timeout.
    # This job is Node-only, so a GitHub-hosted runner covers it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download OpenAPI artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/openapi-artifact

      - name: Create API reference token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.OPENAPI_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.app_private_key }}
          owner: groundsgg
          repositories: api-reference
          permission-contents: write
          permission-pull-requests: write

      - name: Check out API reference
        uses: actions/checkout@v7
        with:
          repository: groundsgg/api-reference
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          path: ${{ github.workspace }}/api-reference

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ github.workspace }}/api-reference/package-lock.json

      - name: Update API snapshot
        uses: groundsgg/.github/actions/update-openapi-snapshot@main
        with:
          artifact_path: ${{ runner.temp }}/openapi-artifact/openapi.json
          checkout_path: ${{ github.workspace }}/api-reference
          service_id: ${{ inputs.service_id }}
          service_title: ${{ inputs.service_title }}
          service_slug: ${{ inputs.service_slug }}

      - name: Validate API reference
        working-directory: ${{ github.workspace }}/api-reference
        run: |
          npm ci
          npm run validate:specs
          npm test
          npm run build

      - name: Detect snapshot changes
        id: changes
        working-directory: ${{ github.workspace }}/api-reference
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve publisher bot identity
        if: steps.changes.outputs.changed == 'true'
        id: publisher-identity
        uses: actions/github-script@v9
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          result-encoding: string
          script: |
            const username = `${process.env.APP_SLUG}[bot]`
            const { data: user } = await github.rest.users.getByUsername({ username })
            return `${user.id}+${username}@users.noreply.github.com`

      - name: Commit and push snapshot
        if: steps.changes.outputs.changed == 'true'
        working-directory: ${{ github.workspace }}/api-reference
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BOT_EMAIL: ${{ steps.publisher-identity.outputs.result }}
          BRANCH_NAME: docs/update-${{ inputs.service_id }}-openapi
          COMMIT_MESSAGE: "docs: update ${{ inputs.service_id }} api snapshot"
        run: |
          set -euo pipefail
          bot_user="${APP_SLUG}[bot]"
          git config user.name "$bot_user"
          git config user.email "$BOT_EMAIL"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH_NAME" >/dev/null 2>&1; then
            git fetch origin "$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
          fi
          git switch -C "$BRANCH_NAME"
          git add public/specs/registry.json public/specs/*/openapi.json
          git commit -m "$COMMIT_MESSAGE"
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH_NAME"

      - name: Create or update snapshot pull request
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v9
        env:
          BRANCH_NAME: docs/update-${{ inputs.service_id }}-openapi
          PR_TITLE: "docs: update ${{ inputs.service_id }} api snapshot"
          SERVICE_ID: ${{ inputs.service_id }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner = 'groundsgg'
            const repo = 'api-reference'
            const head = `${owner}:${process.env.BRANCH_NAME}`
            const body = [
              '## Source',
              '',
              `- Repository: https://github.com/${process.env.SOURCE_REPOSITORY}`,
              `- Ref: \`${process.env.SOURCE_REF}\``,
              `- Commit: https://github.com/${process.env.SOURCE_REPOSITORY}/commit/${process.env.SOURCE_SHA}`,
              '',
              '## Generated changes',
              '',
              `- Updated \`public/specs/${process.env.SERVICE_ID}/openapi.json\``,
              '- Added the registry source when this is the first publication',
              '',
              'The snapshot was generated and validated by the source service. The api-reference checks validate the integrated registry and OpenAPI document again.',
            ].join('\n')
            const { data: pullRequests } = await github.rest.pulls.list({
              owner,
              repo,
              head,
              base: 'main',
              state: 'open',
              per_page: 1,
            })
            if (pullRequests.length === 0) {
              await github.rest.pulls.create({
                owner,
                repo,
                head,
                base: 'main',
                title: process.env.PR_TITLE,
                body,
              })
            } else {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pullRequests[0].number,
                title: process.env.PR_TITLE,
                body,
              })
            }
