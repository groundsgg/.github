name: Release Please

on:
  workflow_call:
    secrets:
      RELEASE_PLEASE_TOKEN:
        description: 'The GitHub token used to create releases.'
        required: true

concurrency:
  group: release-please-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Create Release
    # Free GitHub-hosted runner in public repos; Blacksmith in private ones,
    # where GitHub-hosted arm64 is not offered. Tests `visibility` rather than
    # `repository.private` because GitHub coerces `==` operands to numbers, so
    # an absent `private` field would compare equal to false and hand a private
    # repo a label that does not exist there.
    runs-on: >-
      ${{ github.event.repository.visibility == 'public'
          && 'ubuntu-24.04-arm'
          || 'blacksmith-2vcpu-ubuntu-2404-arm' }}
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Release Please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
