name: Release Please

on:
  workflow_call:
    secrets:
      RELEASE_PLEASE_TOKEN:
        description: 'The GitHub token used to create releases.'
        required: true

concurrency:
  group: release-please-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Create Release
    # Free GitHub-hosted runner in public repos; `grounds-runners` in private ones,
    # where GitHub-hosted arm64 is not offered. Tests `visibility` rather than
    # `repository.private` because GitHub coerces `==` operands to numbers, so
    # an absent `private` field would compare equal to false and hand a private
    # repo a label that does not exist there.
      # Read the three branches in order. A public repo keeps a GitHub-hosted
      # runner: on a self-hosted pool a fork PR would run arbitrary code on
      # hbr1, which also hosts production containers (the org's Default runner
      # group refuses public repositories as a second line). A private repo goes
      # to `grounds-runners`, the shared self-hosted ARC pool (org-level, on
      # hbr1 today). And if `repository` is missing from the event payload, the
      # job lands on hosted amd64 `ubuntu-24.04`, which exists for public and
      # private repos alike -- hosted arm64 does not exist for private ones, and
      # a label no runner matches queues until someone cancels the job.
    runs-on: >-
      ${{ (github.event.repository.visibility == 'public'
            && 'ubuntu-24.04-arm')
          || (github.event.repository.name && 'grounds-runners')
          || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Release Please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
